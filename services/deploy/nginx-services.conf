# Alternative to Caddy if the server already runs nginx.
# Obtain the certificate once with:
#   certbot --nginx -d services.dotsconstruction.com
# (certbot rewrites this file to add the ssl_certificate lines.)
server {
    listen 80;
    server_name services.dotsconstruction.com;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
