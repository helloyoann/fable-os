# Full production stack for services.dotsconstruction.com:
# the app plus Caddy, which terminates TLS with an automatic Let's Encrypt
# certificate. Run from the services/ directory:
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Prerequisite: a DNS A (or AAAA) record pointing
# services.dotsconstruction.com at this machine, with ports 80/443 open.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - ADMIN_EMAILS=yoann@dotsbuilders.com
    volumes:
      - app-data:/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  app-data:
  caddy-data:
  caddy-config:
